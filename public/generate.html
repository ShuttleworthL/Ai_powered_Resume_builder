    <h3 class="pi_header">Personal information</h3>

    <form id="inputs">
        <label for="name_input" class="input_lable">Name</label><br>
        <input type="text" class="inputs" id="name_input" placeholder="Enter your Full Name"><br>

        <label for="email_input" class="input_lable">Email</label><br>
        <input type="text" class="inputs" id="email_input" placeholder="Enter your Email"><br>

        <label for="phone_input" class="input_lable">Phone number</label><br>
        <input type="text" class="inputs" id="phone_input" placeholder="Enter your Phone Number"><br>

        <label for="location_input" class="input_lable">Location</label><br>
        <input type="text" class="inputs" id="location_input" placeholder="Enter your Location"><br>

        <label for="input_area">Summary</label>
        <textarea type="text" placeholder="describe your self and your skills" id="input_area"></textarea><br>

        <label for="image_drag_drop">Upload file (optional)</label>
        <div id="image_drag_drop">
            <p>Drop image here<br>or<br>
            <button id="upload_profile_img" type="button" onclick="payment_redirect()">Upload file</button>
            </p>
            <input type="file" id="profile_img" style="display: none;">
        </div>

        <button type="button" class="generate">generate<img src="images/ai_twinkle.png" alt="ai generate twinkle">
        </button>
    </form>
